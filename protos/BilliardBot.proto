#VRML_SIM R2025a utf8

PROTO BilliardBot [
  field SFVec3f    translation  0 0 0.25
  field SFRotation rotation     0 0 1 0
  field SFString   name         "billiard_bot"
  field SFColor    bodyColor    1 1 0
  field SFString   controller   "ball_pusher"
  field SFString   customData   ""
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    customData IS customData
    children [
      # ---- Body ----
      Shape {
        appearance PBRAppearance {
          baseColor IS bodyColor
          roughness 0.4
          metalness 0.1
        }
        geometry Box {
          size 0.45 0.40 0.20
        }
      }
      # ---- Left Drive Wheel ----
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.0 0.23 -0.05
        }
        device [
          RotationalMotor {
            name "left_motor"
            maxVelocity 10
            maxTorque 50
          }
        ]
        endPoint Solid {
          translation 0.0 0.23 -0.05
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.15 0.15 0.15
              }
              geometry Cylinder {
                radius 0.15
                height 0.08
              }
            }
          ]
          name "left_wheel"
          contactMaterial "wheel"
          boundingObject Cylinder {
            radius 0.15
            height 0.08
          }
          physics Physics {
            density -1
            mass 0.5
          }
        }
      }
      # ---- Right Drive Wheel ----
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0.0 -0.23 -0.05
        }
        device [
          RotationalMotor {
            name "right_motor"
            maxVelocity 10
            maxTorque 50
          }
        ]
        endPoint Solid {
          translation 0.0 -0.23 -0.05
          rotation 1 0 0 1.5708
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.15 0.15 0.15
              }
              geometry Cylinder {
                radius 0.15
                height 0.08
              }
            }
          ]
          name "right_wheel"
          contactMaterial "wheel"
          boundingObject Cylinder {
            radius 0.15
            height 0.08
          }
          physics Physics {
            density -1
            mass 0.5
          }
        }
      }
      # ---- Rear Caster (low-friction sphere) ----
      Solid {
        translation -0.18 0 -0.15
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.3 0.3 0.3
            }
            geometry Sphere {
              radius 0.05
            }
          }
        ]
        name "caster"
        contactMaterial "caster"
        boundingObject Sphere {
          radius 0.05
        }
        physics Physics {
          density -1
          mass 0.1
        }
      }
      # ---- Left Arm (hinge at front-left corner) ----
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.20 0.20 0.05
        }
        device [
          RotationalMotor {
            name "left_arm"
            maxVelocity 2
            minPosition -0.05
            maxPosition 1.5
          }
        ]
        endPoint Solid {
          translation 0.42 0.22 0.05
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.7 0.7 0.7
                roughness 0.8
              }
              geometry Box {
                size 0.40 0.03 0.30
              }
            }
          ]
          name "left_arm"
          boundingObject Box {
            size 0.40 0.03 0.30
          }
          physics Physics {
            density -1
            mass 0.3
          }
        }
      }
      # ---- Right Arm (hinge at front-right corner) ----
      HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 0 1
          anchor 0.20 -0.20 0.05
        }
        device [
          RotationalMotor {
            name "right_arm"
            maxVelocity 2
            minPosition -1.5
            maxPosition 0.05
          }
        ]
        endPoint Solid {
          translation 0.42 -0.22 0.05
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.7 0.7 0.7
                roughness 0.8
              }
              geometry Box {
                size 0.40 0.03 0.30
              }
            }
          ]
          name "right_arm"
          boundingObject Box {
            size 0.40 0.03 0.30
          }
          physics Physics {
            density -1
            mass 0.3
          }
        }
      }
      # ---- Camera ----
      Camera {
        translation 0.24 0 0.10
        name "camera"
        width 160
        height 120
        fieldOfView 1.2
      }
      # ---- GPS ----
      GPS {
        translation 0 0 0.12
        name "gps"
      }
      # ---- Compass ----
      Compass {
        translation 0 0 0.12
        name "compass"
      }
      # ---- Front Distance Sensor ----
      DistanceSensor {
        translation 0.24 0 0
        name "ds_front"
        lookupTable [
          0 1000 0
          5 0 0
        ]
      }
      # ---- Front-Left Distance Sensor ----
      DistanceSensor {
        translation 0.20 0.10 0
        rotation 0 0 1 0.4
        name "ds_left"
        lookupTable [
          0 1000 0
          5 0 0
        ]
      }
      # ---- Front-Right Distance Sensor ----
      DistanceSensor {
        translation 0.20 -0.10 0
        rotation 0 0 1 -0.4
        name "ds_right"
        lookupTable [
          0 1000 0
          5 0 0
        ]
      }
    ]
    boundingObject Box {
      size 0.45 0.40 0.20
    }
    physics Physics {
      density -1
      mass 3.0
    }
  }
}
